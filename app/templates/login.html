{% extends "base.html" %}

{% block body %}
<style>
  body {
    background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .login-container {
    width: 420px;
    max-width: 90%;
    padding: 40px;
    text-align: center;
  }
  .login-header h2 {
    font-family: var(--font-title);
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .login-header p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 30px;
  }
  .form-group {
    margin-bottom: 20px;
    text-align: left;
  }
  .form-group label {
    display: block;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .error-box {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .login-btn {
    width: 100%;
    height: 44px;
    margin-top: 10px;
    font-size: 15px;
  }
</style>

<div class="login-container glass-card">
  <div class="login-header">
    <h2 class="text-gradient">MineAgentOS</h2>
    <p>智能 Agent 管理操作系统</p>
  </div>
  
  {% if error %}
  <div class="error-box">
    <i class="fas fa-exclamation-circle"></i>
    <span>{{ error }}</span>
  </div>
  {% end %}
  
  <form method="post" action="/auth/login">
    {% module xsrf_form_html() %}
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="username" class="form-input-premium" placeholder="请输入用户名" required autocomplete="off">
    </div>
    
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" class="form-input-premium" placeholder="请输入密码" required>
    </div>
    
    <button type="submit" class="glow-btn login-btn">登 录</button>
  </form>
</div>
{% end %}
